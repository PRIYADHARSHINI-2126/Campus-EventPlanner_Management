  <text x="400" y="1122" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    Kalaignarkarunanidhi Institute of Technology, Coimbatore • Proposed Master Event Plan for Academic Assignment
