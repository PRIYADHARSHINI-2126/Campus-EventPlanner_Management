    <path d="M40 18 L60 32 L60 55 L40 68 L20 55 L20 32 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="40" cy="43" r="10" fill="#f59e0b" />
    <text x="40" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">KIT</text>
  </g>

