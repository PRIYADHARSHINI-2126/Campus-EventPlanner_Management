  <text x="160" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1">INSTITUTE OF TECHNOLOGY</text>
  <text x="160" y="96" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Autonomous Institution | Kannampalayam, Coimbatore - 641 402 | Affiliated to Anna University</text>
  <text x="160" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#f59e0b">Accredited with NAAC 'A' Grade &amp; NBA | AICTE Approved</text>

