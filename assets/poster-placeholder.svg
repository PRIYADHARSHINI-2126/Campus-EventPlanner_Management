    <text x="0" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1.5">NATIONAL TECHNO-CULTURAL SYMPOSIUM</text>
    <text x="0" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#cbd5e1">"Where Technology Meets Innovation &amp; Creative Expression"</text>
