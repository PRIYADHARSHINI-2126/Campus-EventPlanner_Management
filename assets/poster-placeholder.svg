      <text x="0" y="34" font-size="11" fill="#cbd5e1">Dr. S. Vasanthkumar (Prof/CSE)</text>
      <text x="0" y="50" font-size="11" fill="#94a3b8">convenor.kitech@kitcbe.com</text>
    </g>

    <g transform="translate(260, 25)">
